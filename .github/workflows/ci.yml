name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/host-logic-test.mjs
      - run: node scripts/host-robustness-test.mjs
      - run: node scripts/cordis4-strict-test.mjs
      - run: node scripts/eval-check.mjs